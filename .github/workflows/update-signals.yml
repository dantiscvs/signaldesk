name: Update SIGNALDESK signals data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch signals from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          set -e
          BASE_ID="appS9LqqKU0QL3F8h"
          TABLE_ID="tblRi4qRq6gK2KVaq"
          mkdir -p /tmp/pages
          offset=""
          page=0
          for i in $(seq 1 10); do
            url="https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}?pageSize=100&sort%5B0%5D%5Bfield%5D=triaged_at&sort%5B0%5D%5Bdirection%5D=desc"
            if [ -n "$offset" ]; then
              url="${url}&offset=${offset}"
            fi
            curl -sf "$url" -H "Authorization: Bearer ${AIRTABLE_TOKEN}" -o "/tmp/pages/resp_${page}.json"
            jq '.records' "/tmp/pages/resp_${page}.json" > "/tmp/pages/records_${page}.json"
            offset=$(jq -r '.offset // empty' "/tmp/pages/resp_${page}.json")
            page=$((page+1))
            if [ -z "$offset" ]; then
              break
            fi
          done
          jq -s 'add' /tmp/pages/records_*.json > /tmp/pages/all_records.json
          jq -n --slurpfile records /tmp/pages/all_records.json --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{generated_at: $generated_at, records: $records[0]}' > dashboard/data.json

      - name: Commit and push if changed
        run: |
          git config user.name "signaldesk-bot"
          git config user.email "actions@github.com"
          git add dashboard/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update signals data [skip ci]"
            git push
          else
            echo "No changes"
          fi
